name: CI

# Pull requests get the cheap, secretless checks: does it compile, do the tests
# pass, does lint complain. No keystore, no Google credentials, no build, no
# release.
#
# The version guard IS here, but it is a different question from the release
# one. `version-check.ts` (release workflow) asks "has this version been released".
# `version-guard.ts` (this file) asks "would merging this branch move main
# BACKWARDS" — which only a pull request can be asked, and which nothing checked
# until 2026-11-15, when all three open PRs turned out to carry a lower
# versionCode than main.
#
# A PR that does not bump at all still passes: carrying the base's version
# forward is legitimate. Only a LOWER code, or a code and name that disagree
# about which build this is, fails.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest job first, on purpose: it needs no JDK, no SDK, no Gradle cache. A
  # downgrade is a fact about two files, so the answer arrives in seconds rather
  # than after a full unit-test run.
  version:
    name: version does not go backwards
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` so `origin/main` is a real ref with history. The default
      # shallow single-commit clone has no other branches at all, and the guard
      # would be reading a base that does not exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install tooling
        run: npm ci --silent --no-audit --no-fund

      # `checkout` on a pull_request gives the MERGE commit, and a full clone does not
      # guarantee a local `origin/main`. Both are needed: the merge tree is the version
      # that would actually land, and the base is what it must not undercut.
      - name: Fetch the base branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Guard the version
        run: node tools/version-guard.ts --base origin/main

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, explicitly: ubuntu-latest ships Node 20, which cannot execute a
      # .ts file at all. `tools/test-summary.ts` runs under it.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the platform through the ACTION, not a follow-up sdkmanager call.
      #
      # `packages:` must be set explicitly. The action defaults to `tools platform-tools`,
      # and Google REMOVED the `tools` package from the SDK repository — so the default
      # now fails with "Failed to find package 'tools'" and exit code 1, before the job
      # does anything useful. Verified on run 41630793088, which died 26s in.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The guard scripts are TypeScript executed directly by Node. Typechecking
      # them here means a broken guard fails CI rather than failing silently at
      # the moment it is needed to block a bad release.
      - name: Install tooling
        run: npm ci --silent --no-audit --no-fund

      - name: Typecheck guard scripts
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Verify screenshots
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      # A test job that greps for "BUILD SUCCESSFUL" can pass having run zero
      # tests. Read the XML reports and assert a real run happened.
      - name: Assert tests actually ran
        run: node tools/test-summary.ts

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, explicitly: ubuntu-latest ships Node 20, which cannot execute a
      # .ts file at all. `tools/test-summary.ts` runs under it.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the platform through the ACTION, not a follow-up sdkmanager call.
      #
      # `packages:` must be set explicitly. The action defaults to `tools platform-tools`,
      # and Google REMOVED the `tools` package from the SDK repository — so the default
      # now fails with "Failed to find package 'tools'" and exit code 1, before the job
      # does anything useful. Verified on run 41630793088, which died 26s in.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # `lint` is configured with abortOnError = true, so a real defect fails here.
      # Warnings stay warnings (warningsAsErrors = false) — a styling nit must not
      # block a contributor.
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
