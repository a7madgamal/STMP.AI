name: CI

# Pull requests get the cheap, secretless checks: does it compile, do the tests
# pass, does lint complain. No keystore, no Google credentials, no build, no
# release.
#
# Deliberately NOT here: the version guard. A PR legitimately carries the same
# version as the tag it branched from, so guarding it there would fail every PR
# for the wrong reason. That check belongs to the release workflow.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, explicitly: ubuntu-latest ships Node 20, which cannot execute a
      # .ts file at all. `tools/test-summary.ts` runs under it.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the platform through the ACTION, not a follow-up sdkmanager call.
      #
      # `packages:` must be set explicitly. The action defaults to `tools platform-tools`,
      # and Google REMOVED the `tools` package from the SDK repository — so the default
      # now fails with "Failed to find package 'tools'" and exit code 1, before the job
      # does anything useful. Verified on run 41630793088, which died 26s in.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # The guard scripts are TypeScript executed directly by Node. Typechecking
      # them here means a broken guard fails CI rather than failing silently at
      # the moment it is needed to block a bad release.
      - name: Install tooling
        run: npm ci --silent --no-audit --no-fund

      - name: Typecheck guard scripts
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # A test job that greps for "BUILD SUCCESSFUL" can pass having run zero
      # tests. Read the XML reports and assert a real run happened.
      - name: Assert tests actually ran
        run: node tools/test-summary.ts

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, explicitly: ubuntu-latest ships Node 20, which cannot execute a
      # .ts file at all. `tools/test-summary.ts` runs under it.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the platform through the ACTION, not a follow-up sdkmanager call.
      #
      # `packages:` must be set explicitly. The action defaults to `tools platform-tools`,
      # and Google REMOVED the `tools` package from the SDK repository — so the default
      # now fails with "Failed to find package 'tools'" and exit code 1, before the job
      # does anything useful. Verified on run 41630793088, which died 26s in.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # `lint` is configured with abortOnError = true, so a real defect fails here.
      # Warnings stay warnings (warningsAsErrors = false) — a styling nit must not
      # block a contributor.
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
