name: CI

# Pull requests get the cheap, secretless checks: does it compile, do the tests
# pass, does lint complain. No keystore, no Google credentials, no build, no
# release.
#
# Deliberately NOT here: the version guard. A PR legitimately carries the same
# version as the tag it branched from, so guarding it there would fail every PR
# for the wrong reason. That check belongs to the release workflow.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # A test job that greps for "BUILD SUCCESSFUL" can pass having run zero
      # tests. Read the XML reports and assert the count is non-zero.
      - name: Assert tests actually ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          if not files:
              sys.exit('no test result XML found — the test task produced nothing')
          total = failures = 0
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0))
              failures += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f'tests={total} failures={failures}')
          if total == 0:
              sys.exit('zero tests ran — that is a broken harness, not a pass')
          if failures:
              sys.exit(f'{failures} failing test(s)')
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # `lint` is configured with abortOnError = true, so a real defect fails here.
      # Warnings stay warnings (warningsAsErrors = false) — a styling nit must not
      # block a contributor.
      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
