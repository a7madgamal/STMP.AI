name: Promote

# Move an existing BETA release to STABLE.
#
# This changes NOTHING about the artifact. Promotion flips one metadata field —
# `prerelease: false` — so the bytes, the tag, the signature and the versionCode
# are all identical to what beta testers already installed. Rebuilding here would
# be worse than useless: a second build is not bit-for-bit reproducible, so the
# promoted APK would differ from the one that was tested.
#
# That is the pattern established projects use (Electron, Flutter, Rust): one
# immutable artifact per version, a mutable marker saying which channel it is in.
#
# Designed to be driven by an agent or a human: it takes a tag, verifies the
# preconditions, and fails loudly rather than guessing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote, e.g. v0.43.66'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: promote beta to stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ONE implementation, in TypeScript, shared with the local path.
      #
      # `tools/promote.ts` performs every precondition check (draft, already-stable,
      # exactly one APK), verifies the APK's signer, sends the REST PATCH and re-reads
      # the state to prove it took. Duplicating that logic in YAML is how the workflow
      # and the script drift into disagreeing about what "promotable" means — and the
      # version of it that ran fewer checks is the one nobody notices.
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/promote.ts "${{ inputs.tag }}"
